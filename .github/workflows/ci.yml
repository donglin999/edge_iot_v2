# GitHub Actions CI —— 边缘IoT数据采集系统
#
# 作用：每次 push 或开 PR 时，自动在 GitHub 的干净服务器上拉代码、装依赖、
#       跑后端测试、检查并构建前端。红叉会显示在 PR 上，挡住有问题的合并。
#
# 这个文件放在 .github/workflows/ 下，GitHub 自动识别并执行，不需要任何额外配置。

name: CI

# ── 触发条件：什么时候跑 ───────────────────────────────────────────────
on:
  push:
    branches: ['**']        # 推到任意分支都跑
  pull_request:
    # 迁移里程碑先汇入 integration；最终 PR 再进入 master。
    branches: [master, codex/remediation-integration]

# 同一分支新 push 时，取消上一次还没跑完的 CI，省时间省额度
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── 仓库政策：迁移路线与依赖可复现性 ────────────────────────────────
  policy:
    name: 迁移政策门禁 (无 C++ 后端 + Python constraints)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout 代码
        uses: actions/checkout@v4

      - name: Shell 静态检查
        run: bash -n scripts/ci/*.sh scripts/offline/build-wheelhouse.sh backend/run_tests.sh

      - name: C++ 后端排除门禁自测
        run: bash scripts/ci/test-guard-no-cpp-backend.sh

      - name: Wheelhouse Python 3.10 解析器门禁自测
        run: bash scripts/ci/test-wheelhouse-python.sh

      - name: 离线部署密钥 fail-closed 门禁
        run: bash scripts/ci/test-offline-secret-safety.sh

      - name: C++ 后端排除门禁
        run: bash scripts/ci/guard-no-cpp-backend.sh

      - name: Python constraints 消费链检查
        run: bash scripts/ci/check-python-constraints.sh

  # ── 后端：Django + pytest ────────────────────────────────────────────
  backend:
    name: 后端测试 (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend   # 所有 run 步骤都在 backend/ 下执行

    steps:
      # 1. 把仓库代码拉到 CI 服务器上
      - name: Checkout 代码
        uses: actions/checkout@v4

      # 2. 装 Python 3.10（与 backend/Dockerfile 的 python:3.10-slim 对齐）
      - name: 安装 Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip           # 缓存 pip 下载，后续跑得更快
          cache-dependency-path: |
            backend/requirements.txt
            backend/tests/requirements-test.txt
            backend/constraints-py310.txt

      # 3. 单次解析业务 + 测试依赖；精确 constraints 避免 resolver 回溯。
      - name: 安装依赖
        run: |
          python -m pip install "pip==23.0.1"
          python -m pip install \
            --constraint constraints-py310.txt \
            --requirement requirements.txt \
            --requirement tests/requirements-test.txt
          python -m pip check

      - name: 验证已安装依赖全部受 constraints 约束
        run: bash ../scripts/ci/check-python-constraints.sh --installed

      # 4. 跑测试（SQLite + Celery eager，无需 Redis/InfluxDB）
      - name: 运行测试
        run: python -m pytest tests/ -c tests/pytest.ini

      # 5. 端到端拉通：设备→采集→sink→告警/自起 全链路（@pytest.mark.e2e）
      #    上一步已覆盖全部用例，这一步单独跑 e2e 子集，给一个独立的"全流程拉通"绿灯
      - name: 端到端拉通测试 (e2e)
        run: python -m pytest tests/ -c tests/pytest.ini -m e2e

  # ── 前端：React + Vite ───────────────────────────────────────────────
  frontend:
    name: 前端检查、测试与构建 (eslint + vitest + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout 代码
        uses: actions/checkout@v4

      # 装 Node 20（Vite 4 需要 Node 18+），并缓存 npm
      - name: 安装 Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # npm ci：按 package-lock.json 精确安装，比 npm install 更适合 CI
      - name: 安装依赖
        run: npm ci

      # 代码风格检查（package.json 里的 lint 脚本，--max-warnings 0 即零容忍）
      - name: Lint
        run: npm run lint

      # 单元测试（vitest + jsdom + testing-library）
      #
      # 这一步是有来历的：把「保存」按钮彻底堵死的两个 bug——协议从下拉选好了
      # 表单里却是空值、scada 任务编码必填却默认开启——lint 和 build 全都是绿的，
      # 只有把组件真渲染起来点一遍才暴露。所以测的是「用户点下去会发生什么」。
      - name: 单元测试 (vitest)
        run: npm run test

      # 构建（tsc 类型检查 + vite build），能 build 过才算前端没坏
      - name: 构建
        run: npm run build
