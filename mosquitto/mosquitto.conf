# Center MQTT broker — Phase 2 P1 (XIU-98).
#
# Local-dev / Phase 2 smoke configuration: anonymous access on 1883.
# Production deployments must overlay TLS + ACLs on top of this (Phase 2
# later milestones); the wire protocol carried over these topics is
# independent of this file.
#
# Topic tree (see plan §9.3):
#   edge/<edge_id>/uplink/<frame_type>   edge → center
#   edge/<edge_id>/lwt                   edge → center (last-will)
#   edge/<edge_id>/downlink/<frame_type> center → edge (P2 — not used yet)

listener 1883
protocol mqtt

# Phase 2 P1 — anonymous for local dev. TLS + auth is a later milestone.
allow_anonymous true

# In-memory only: a Phase-2 broker restart drops queued messages by design,
# the edge's durable outbox (XIU-71 M5) is the source-of-truth replay path.
persistence false

# Mosquitto by default logs to stdout when no log_dest is configured, which
# is what we want under `docker logs mosquitto`.
log_type error
log_type warning
log_type notice
