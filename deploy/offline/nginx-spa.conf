# nginx reverse-proxy for the offline amd64 packages.
#
# Serves the pre-built Vite SPA static bundle on :80 and reverse-proxies the
# SAME two path prefixes the frontend calls at runtime — /api/ and /ws/ — to
# the Django/Daphne backend. The SPA always uses relative URLs, so this single
# config works for both the monolith (django:8000 / runserver) and the
# distributed center (center-django:8000 / daphne websockets).
#
# Upstream host is parameterised by the `BACKEND_UPSTREAM` env consumed via the
# nginx `envsubst` template hook (nginx:alpine runs /docker-entrypoint.d/
# 20-envsubst-on-templates.sh when the file lives in /etc/nginx/templates/).

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA history fallback — any unknown path returns index.html so client-side
    # routing works on hard refresh.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://${BACKEND_UPSTREAM};
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # WebSocket upgrade for Django Channels (/ws/fleet/, /ws/data/, ...).
    location /ws/ {
        proxy_pass http://${BACKEND_UPSTREAM};
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }
}
