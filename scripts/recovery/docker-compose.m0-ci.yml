x-backend-environment: &backend-environment
  DJANGO_SETTINGS_MODULE: control_plane.settings
  DJANGO_DB_NAME: /data/restored.sqlite3
  SECRET_KEY: m0-ci-disposable-secret-not-for-production
  DEBUG: "False"
  ALLOWED_HOSTS: 127.0.0.1,localhost,web,django
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  CELERY_BROKER_URL: redis://redis:6379/0
  CELERY_RESULT_BACKEND: redis://redis:6379/0
  INFLUXDB_HOST: influx
  INFLUXDB_PORT: "8086"
  INFLUXDB_TOKEN: ${M0_INFLUX_TOKEN:?ephemeral drill token required}
  INFLUXDB_ORG: m0-ci
  INFLUXDB_BUCKET: m0-restored
  INFLUX_SPILL_DB_PATH: /data/influx-spill.sqlite3

services:
  redis:
    image: ${M0_REDIS_IMAGE_ID:?immutable Redis ID required}
    pull_policy: never
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    networks: [drill]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 30

  influx:
    image: ${M0_INFLUX_IMAGE_ID:?immutable Influx ID required}
    pull_policy: never
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: m0-ci-admin
      DOCKER_INFLUXDB_INIT_PASSWORD: m0-ci-disposable-password
      DOCKER_INFLUXDB_INIT_ORG: m0-ci
      DOCKER_INFLUXDB_INIT_BUCKET: m0-source
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: ${M0_INFLUX_TOKEN:?ephemeral drill token required}
    networks: [drill]
    ports:
      - target: 8086
        published: "0"
        host_ip: "127.0.0.1"
        protocol: tcp
    volumes:
      - influx-data:/var/lib/influxdb2
      - influx-config:/etc/influxdb2
    healthcheck:
      test: ["CMD", "influx", "ping", "--host", "http://127.0.0.1:8086"]
      interval: 2s
      timeout: 2s
      retries: 60

  volume-init:
    image: ${M0_BACKEND_IMAGE_ID:?immutable backend ID required}
    pull_policy: never
    profiles: [prep]
    user: "0:0"
    command: ["sh", "-c", "chown ${M0_UID:?uid required}:${M0_GID:?gid required} /data /app/logs && chmod 0750 /data /app/logs"]
    volumes:
      - app-db:/data
      - app-logs:/app/logs
    networks: [drill]

  migrate:
    image: ${M0_BACKEND_IMAGE_ID:?immutable backend ID required}
    pull_policy: never
    profiles: [prep]
    user: "${M0_UID:?uid required}:${M0_GID:?gid required}"
    environment: *backend-environment
    command: ["python", "manage.py", "migrate", "--noinput"]
    volumes:
      - app-db:/data
      - app-logs:/app/logs
    networks: [drill]

  seed:
    image: ${M0_BACKEND_IMAGE_ID:?immutable backend ID required}
    pull_policy: never
    profiles: [prep]
    user: "${M0_UID:?uid required}:${M0_GID:?gid required}"
    environment: *backend-environment
    command: ["python", "manage.py", "shell", "-c", "exec(open('/recovery/seed_fixture.py', encoding='utf-8').read())"]
    volumes:
      - app-db:/data
      - app-logs:/app/logs
      - ${M0_REPO_ROOT:?repository root required}/scripts/recovery:/recovery:ro
    networks: [drill]

  recovery-tool:
    image: ${M0_TOOL_IMAGE_ID:?immutable recovery tool ID required}
    pull_policy: never
    profiles: [tools]
    user: "${M0_UID:?uid required}:${M0_GID:?gid required}"
    working_dir: /repo
    environment:
      HOME: /tmp
      INFLUX_TOKEN: ${M0_INFLUX_TOKEN:?ephemeral drill token required}
    volumes:
      - app-db:/data
      - ${M0_EVIDENCE_ROOT:?evidence root required}:/evidence
      - ${M0_TOKEN_FILE:?token file required}:/run/secrets/influx.token:ro
    networks: [drill]

  django:
    image: ${M0_BACKEND_IMAGE_ID:?immutable backend ID required}
    pull_policy: never
    user: "${M0_UID:?uid required}:${M0_GID:?gid required}"
    environment: *backend-environment
    command: ["daphne", "-b", "0.0.0.0", "-p", "8000", "control_plane.asgi:application"]
    volumes:
      - app-db:/data
      - app-logs:/app/logs
    networks: [drill]
    depends_on:
      redis:
        condition: service_healthy
      influx:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/config/sites/', timeout=3).read()"]
      interval: 2s
      timeout: 4s
      retries: 60

  celery-acq:
    image: ${M0_BACKEND_IMAGE_ID:?immutable backend ID required}
    pull_policy: never
    user: "${M0_UID:?uid required}:${M0_GID:?gid required}"
    environment: *backend-environment
    command: ["celery", "-A", "control_plane", "worker", "-l", "warning", "--pool=solo", "--concurrency=1", "-Q", "acquisition", "-n", "m0-acq@%h"]
    volumes:
      - app-db:/data
      - app-logs:/app/logs
    networks: [drill]
    depends_on:
      redis:
        condition: service_healthy
      influx:
        condition: service_healthy

  celery-short:
    image: ${M0_BACKEND_IMAGE_ID:?immutable backend ID required}
    pull_policy: never
    user: "${M0_UID:?uid required}:${M0_GID:?gid required}"
    environment: *backend-environment
    command: ["celery", "-A", "control_plane", "worker", "-l", "warning", "--pool=solo", "--concurrency=1", "-Q", "short", "-n", "m0-short@%h"]
    volumes:
      - app-db:/data
      - app-logs:/app/logs
    networks: [drill]
    depends_on:
      redis:
        condition: service_healthy
      influx:
        condition: service_healthy

  web:
    image: ${M0_WEB_IMAGE_ID:?immutable web ID required}
    pull_policy: never
    environment:
      BACKEND_UPSTREAM: django:8000
      WEB_PORT: "80"
    networks: [drill]
    ports:
      - target: 80
        published: "0"
        host_ip: "127.0.0.1"
        protocol: tcp
    depends_on:
      django:
        condition: service_healthy

networks:
  drill:
    driver: bridge
    internal: true

volumes:
  app-db:
  app-logs:
  influx-data:
  influx-config:
