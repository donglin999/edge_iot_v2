# ============================================================================
# Edge compose — one工控机 stack: edge-agent + local InfluxDB + mock Modbus.
#
# The edge-agent runs the acquisition pipeline in-process (imports
# backend.acquisition) and writes samples to the local InfluxDB. It does
# NOT run django/redis/celery — those live on the center.
#
# Required env (export before `up`):
#   EDGE_ID       e.g. edge-shanghai-line-1
#   EDGE_TOKEN    one-shot token returned by POST /api/fleet/edges/
#   CENTER_URL    e.g. ws://192.168.1.10:8000/ws/fleet/
#
# Use (build context is the repo root so the image can pull backend deps):
#   docker compose -f docker-compose.edge.yml up -d --build
# ============================================================================

services:
  influxdb:
    image: influxdb:2.7
    container_name: edge-influxdb
    ports:
      - "8086:8086"
    networks:
      - edge-network
    volumes:
      - edge-influxdb-data:/var/lib/influxdb2
      - edge-influxdb-config:/etc/influxdb2
    environment:
      - DOCKER_INFLUXDB_INIT_MODE=setup
      - DOCKER_INFLUXDB_INIT_USERNAME=admin
      - DOCKER_INFLUXDB_INIT_PASSWORD=admin123456
      - DOCKER_INFLUXDB_INIT_ORG=edge-iot
      - DOCKER_INFLUXDB_INIT_BUCKET=iot-data
      - DOCKER_INFLUXDB_INIT_ADMIN_TOKEN=my-super-secret-auth-token
      - TZ=Asia/Shanghai
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "influx", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # Mock Modbus TCP device — same generator the central docker-compose.yml
  # uses, so an edge can be smoke-tested without real PLC hardware. A
  # Device pointed at host ``mock-modbus-edge`` port 5020 returns 9
  # holding registers of plausible data.
  mock-modbus:
    image: python:3.10-slim
    container_name: mock-modbus-edge
    networks:
      - edge-network
    volumes:
      - ./mock/entrypoint.sh:/entrypoint.sh:ro
      - ./mock:/mock:ro
    working_dir: /mock
    entrypoint: ["/bin/bash", "/entrypoint.sh"]
    restart: unless-stopped

  edge-agent:
    build:
      # Repo root so the image can COPY backend/requirements.txt.
      context: .
      dockerfile: edge-agent/Dockerfile
    container_name: edge-agent
    # M6: expose the read-only history HTTP port so the center can pull
    # samples for the /data page on demand. Bind to a host port that can
    # be overridden via ${EDGE_HISTORY_HOST_PORT} so multiple edges on a
    # single host don't collide. Default mirrors the in-container port.
    ports:
      - "${EDGE_HISTORY_HOST_PORT:-18086}:18086"
    networks:
      - edge-network
    # Mount the host's backend so the agent can `import backend.acquisition`
    # without rebuilding the image. The edge-side SQLite (edge_state.db)
    # lives in a named volume so it survives container restarts — that is
    # what powers auto-resume of acquisition tasks.
    volumes:
      - ./edge-agent:/app
      - ./backend:/opt/backend:ro
      - edge-agent-state:/var/lib/edge-agent
    environment:
      - EDGE_ID=${EDGE_ID:?EDGE_ID is required}
      - EDGE_TOKEN=${EDGE_TOKEN:?EDGE_TOKEN is required}
      - CENTER_URL=${CENTER_URL:?CENTER_URL is required}
      - EDGE_LABELS=${EDGE_LABELS:-}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      # --- Django bootstrap for the in-process acquisition pipeline ----
      - DJANGO_SETTINGS_MODULE=control_plane.settings
      - BACKEND_DIR=/opt/backend
      - EDGE_STATE_DB=/var/lib/edge-agent/edge_state.db
      # The center code is mounted read-only, so its LOGGING must not write
      # into /opt/backend/logs. Point it at the writable state volume.
      - DJANGO_LOG_DIR=/var/lib/edge-agent/logs
      - PYTHONPATH=/opt/backend:/app/src
      # --- local InfluxDB the pipeline writes samples into -------------
      - INFLUXDB_HOST=edge-influxdb
      - INFLUXDB_PORT=8086
      - INFLUXDB_TOKEN=my-super-secret-auth-token
      - INFLUXDB_ORG=edge-iot
      - INFLUXDB_BUCKET=iot-data
      # --- M6 history-proxy HTTP server --------------------------------
      # Default port 18086; override per-edge via EDGE_HISTORY_HOST_PORT
      # (compose) + EDGE_HISTORY_URL (env) so the center can reach this
      # edge without falling back to docker service-name DNS.
      - EDGE_HISTORY_ENABLED=${EDGE_HISTORY_ENABLED:-true}
      - EDGE_HISTORY_PORT=18086
      - EDGE_HISTORY_MAX_POINTS=${EDGE_HISTORY_MAX_POINTS:-50000}
      - EDGE_HISTORY_URL=${EDGE_HISTORY_URL:-}
      # --- Phase 2 P3 (XIU-102): MQTT uplink ---------------------------
      # Default to the MQTT bus once the center has Mosquitto stood up
      # (Phase 2 P1 / XIU-100). Set EDGE_TRANSPORT=ws to fall back to the
      # legacy WS uplink during A/B / debugging. EDGE_MQTT_BROKER points
      # at the center broker; the host segment is whatever DNS name /
      # address the edge can reach the center's mosquitto on.
      - EDGE_TRANSPORT=${EDGE_TRANSPORT:-mqtt}
      - EDGE_MQTT_BROKER=${EDGE_MQTT_BROKER:-mqtt://mosquitto:1883}
      - TZ=Asia/Shanghai
    depends_on:
      influxdb:
        condition: service_healthy
    restart: unless-stopped

networks:
  edge-network:
    driver: bridge

volumes:
  edge-influxdb-data:
  edge-influxdb-config:
  edge-agent-state:
