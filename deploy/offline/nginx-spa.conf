# 离线包的 nginx 反向代理。
#
# 在 :80 服务预构建的 Vite SPA 静态包，并把前端运行时调用的两个路径前缀
# —— /api/ 和 /ws/ —— 反代到 Django/Channels 后端。SPA 全用相对 URL，所以
# 这份配置对单体（django-iot:8000 / runserver）直接可用。
#
# 上游主机由 BACKEND_UPSTREAM 环境变量参数化（nginx:alpine 的 envsubst 模板钩子：
# 文件放在 /etc/nginx/templates/ 时会执行 20-envsubst-on-templates.sh）。

server {
    listen ${WEB_PORT};
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA 前端路由回退 —— 任何未知路径都返回 index.html，硬刷新也能正常路由。
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://${BACKEND_UPSTREAM};
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Django Channels 的 WebSocket 升级（/ws/data/、/ws/acquisition/ ...）。
    location /ws/ {
        proxy_pass http://${BACKEND_UPSTREAM};
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }
}
