[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "edge-agent"
version = "0.2.0"
description = "edge_iot_v2 distributed edge agent — config dispatch + task running (M2)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
authors = [{ name = "edge_iot_v2 backend" }]

# Keep deps minimal. The agent imports backend.acquisition via PYTHONPATH /
# editable install at runtime; it does NOT vendor copies of those deps here.
dependencies = [
    "websockets>=12.0",
    "aiohttp>=3.9",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[project.scripts]
edge-agent = "edge_agent.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
edge_agent = ["py.typed"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
