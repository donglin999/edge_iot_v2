# ============================================================================
# 离线单体（master + scada 协议）—— amd64，无 registry / 无 build / 无 npm。
# 应用镜像（edge-iot/backend、edge-iot/web）由 images.tar 通过 docker load 载入。
#
# 【网络形态】所有服务用 host 网络（network_mode: host），因此容器内 127.0.0.1
# 等于宿主机 loopback：
#   - InfluxDB **由生产环境自行运行**；地址、端口、org 与 bucket 都必须由受保护
#     env 文件显式提供，本包不内置任何现场值。
#   - Redis 由本包启动（redis:7.0.10，目标机已有镜像）监听 127.0.0.1:6379。
#     若宿主机已自跑 Redis 占用 6379，删掉下面 redis 服务即可，后端仍连 127.0.0.1:6379。
#   - Django 仅绑 127.0.0.1:8000（不对外）；nginx(web) 绑 0.0.0.0:80 反代到它，
#     是唯一对外入口。
#
# 【两种运行模式】—— 配置时才需要前端，平时只跑采集更省资源
#   完整模式(带界面)：docker compose --profile ui up -d
#       redis + migrate + celery-acq + celery-short + django + web
#       用于配置网关/设备/测点、看数据可视化。
#   采集模式(无界面)：docker compose up -d          ← 默认，省 ~100-150MB
#       redis + migrate + celery-acq + celery-short（django/web 不起）
#       采集照常跑；启动时会自动恢复上次 RUNNING 的会话（自愈逻辑在 celery 里）。
#   随时切换：停界面 docker compose stop django web / 开界面 --profile ui up -d
#   注：migrate 是一次性容器（跑完即退），两种模式都会执行，所以无界面也能自洽。
#
# 敏感值没有默认值：必须用权限 0400/0600 的 env 文件显式传入。
# 请先复制 .env.example、填值并运行 ./load-and-up.sh --env-file .env。
# 资源调优：CELERY_ACQ_CONCURRENCY 默认 32 线程；大规模现场请压测后再显式调高。
# 健康判据(带界面时)：curl -fsS http://localhost/  -> HTTP 200
# ============================================================================

services:
  redis:
    image: redis:7.0.10          # 目标机已有；本包起独立 redis
    container_name: redis-iot
    network_mode: host
    restart: unless-stopped
    # 若宿主机已自跑 redis 占用 6379，在 .env 里设 REDIS_PORT=6380（或其它空闲端口），
    # 本自带 redis 监听端口与应用连接端口会一并切过去，互不冲突。
    command: redis-server --bind 127.0.0.1 --protected-mode yes --port ${REDIS_PORT:-6379}
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "${REDIS_PORT:-6379}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  # 一次性迁移容器：跑完即退。两种模式都会执行，因此无界面(headless)也能自洽；
  # 同时保证 celery/django 一定在建表之后才启动（消除早启动race）。
  migrate:
    image: edge-iot/backend:offline-amd64
    container_name: migrate-iot
    network_mode: host
    volumes:
      - app-db:/data
    environment:
      - DJANGO_SETTINGS_MODULE=control_plane.settings
      - DJANGO_DB_NAME=${DJANGO_DB_NAME:-/data/db.sqlite3}
      - "SECRET_KEY=${SECRET_KEY:?SECRET_KEY must be set in the protected env file}"
      - DEBUG=${DEBUG:-False}
      - "ALLOWED_HOSTS=${ALLOWED_HOSTS:?ALLOWED_HOSTS must be set in the protected env file}"
      - ALLOW_PRIVATE_NETWORK_TESTS=${ALLOW_PRIVATE_NETWORK_TESTS:-False}
    restart: "no"
    command: python manage.py migrate

  django:
    image: edge-iot/backend:offline-amd64
    container_name: django-iot
    profiles: ["ui"]           # 仅「完整模式」启动：docker compose --profile ui up -d
    network_mode: host
    # 配置库 db.sqlite3 放共享卷 app-db，django 与 celery 共用同一份（否则各容器
    # 各建一份、celery 看不到 django migrate 出来的表 → "no such table"）。
    volumes:
      - app-db:/data
    environment:
      - DJANGO_SETTINGS_MODULE=control_plane.settings
      - DJANGO_DB_NAME=${DJANGO_DB_NAME:-/data/db.sqlite3}
      - "SECRET_KEY=${SECRET_KEY:?SECRET_KEY must be set in the protected env file}"
      - DEBUG=${DEBUG:-False}
      - "ALLOWED_HOSTS=${ALLOWED_HOSTS:?ALLOWED_HOSTS must be set in the protected env file}"
      - ALLOW_PRIVATE_NETWORK_TESTS=${ALLOW_PRIVATE_NETWORK_TESTS:-False}
      - REDIS_HOST=${REDIS_HOST:-127.0.0.1}
      - REDIS_PORT=${REDIS_PORT:-6379}
      # InfluxDB 由生产环境自行运行在宿主机；host 网络下 127.0.0.1 即宿主机
      - "INFLUXDB_HOST=${INFLUXDB_HOST:?INFLUXDB_HOST must be set in the protected env file}"
      - "INFLUXDB_PORT=${INFLUXDB_PORT:?INFLUXDB_PORT must be set in the protected env file}"
      - "INFLUXDB_TOKEN=${INFLUXDB_TOKEN:?INFLUXDB_TOKEN must be set in the protected env file}"
      - "INFLUXDB_ORG=${INFLUXDB_ORG:?INFLUXDB_ORG must be set in the protected env file}"
      - "INFLUXDB_BUCKET=${INFLUXDB_BUCKET:?INFLUXDB_BUCKET must be set in the protected env file}"
    depends_on:
      redis: {condition: service_healthy}
      migrate: {condition: service_completed_successfully}
    restart: unless-stopped
    # 迁移已由一次性 migrate 容器完成，这里只起服务
    command: python manage.py runserver 127.0.0.1:8000

  celery-acq:
    image: edge-iot/backend:offline-amd64
    container_name: celery-acq
    network_mode: host
    volumes:
      - app-db:/data          # 与 django 共用同一份配置库
    environment:
      - DJANGO_SETTINGS_MODULE=control_plane.settings
      - DJANGO_DB_NAME=${DJANGO_DB_NAME:-/data/db.sqlite3}
      - "SECRET_KEY=${SECRET_KEY:?SECRET_KEY must be set in the protected env file}"
      - DEBUG=${DEBUG:-False}
      - "ALLOWED_HOSTS=${ALLOWED_HOSTS:?ALLOWED_HOSTS must be set in the protected env file}"
      - ALLOW_PRIVATE_NETWORK_TESTS=${ALLOW_PRIVATE_NETWORK_TESTS:-False}
      - REDIS_HOST=${REDIS_HOST:-127.0.0.1}
      - REDIS_PORT=${REDIS_PORT:-6379}
      - "INFLUXDB_HOST=${INFLUXDB_HOST:?INFLUXDB_HOST must be set in the protected env file}"
      - "INFLUXDB_PORT=${INFLUXDB_PORT:?INFLUXDB_PORT must be set in the protected env file}"
      - "INFLUXDB_TOKEN=${INFLUXDB_TOKEN:?INFLUXDB_TOKEN must be set in the protected env file}"
      - "INFLUXDB_ORG=${INFLUXDB_ORG:?INFLUXDB_ORG must be set in the protected env file}"
      - "INFLUXDB_BUCKET=${INFLUXDB_BUCKET:?INFLUXDB_BUCKET must be set in the protected env file}"
      # 失败批次与配置库共用持久卷；容器重建后仍可继续回放。
      - INFLUX_SPILL_DB_PATH=${INFLUX_SPILL_DB_PATH:-/data/influx_spill.sqlite3}
    depends_on:
      redis: {condition: service_healthy}
      migrate: {condition: service_completed_successfully}
    restart: unless-stopped
    # 并发线程数可调：默认 32，大规模现场请压测后再显式调高。
    command: celery -A control_plane worker -l info --pool=threads --concurrency=${CELERY_ACQ_CONCURRENCY:-32} -Q acquisition -n acq@%h

  celery-short:
    image: edge-iot/backend:offline-amd64
    container_name: celery-short
    network_mode: host
    volumes:
      - app-db:/data          # 与 django 共用同一份配置库
    environment:
      - DJANGO_SETTINGS_MODULE=control_plane.settings
      - DJANGO_DB_NAME=${DJANGO_DB_NAME:-/data/db.sqlite3}
      - "SECRET_KEY=${SECRET_KEY:?SECRET_KEY must be set in the protected env file}"
      - DEBUG=${DEBUG:-False}
      - "ALLOWED_HOSTS=${ALLOWED_HOSTS:?ALLOWED_HOSTS must be set in the protected env file}"
      - ALLOW_PRIVATE_NETWORK_TESTS=${ALLOW_PRIVATE_NETWORK_TESTS:-False}
      - REDIS_HOST=${REDIS_HOST:-127.0.0.1}
      - REDIS_PORT=${REDIS_PORT:-6379}
      - "INFLUXDB_HOST=${INFLUXDB_HOST:?INFLUXDB_HOST must be set in the protected env file}"
      - "INFLUXDB_PORT=${INFLUXDB_PORT:?INFLUXDB_PORT must be set in the protected env file}"
      - "INFLUXDB_TOKEN=${INFLUXDB_TOKEN:?INFLUXDB_TOKEN must be set in the protected env file}"
      - "INFLUXDB_ORG=${INFLUXDB_ORG:?INFLUXDB_ORG must be set in the protected env file}"
      - "INFLUXDB_BUCKET=${INFLUXDB_BUCKET:?INFLUXDB_BUCKET must be set in the protected env file}"
    depends_on:
      redis: {condition: service_healthy}
      migrate: {condition: service_completed_successfully}
    restart: unless-stopped
    # -B：内嵌 celery beat（数采故障自起看门狗周期任务），单机无需独立容器。
    # 无界面模式下它照常跑，所以自愈/告警不受影响。
    command: celery -A control_plane worker -B -l info --pool=threads --concurrency=${CELERY_SHORT_CONCURRENCY:-8} -Q short -n short@%h

  web:
    image: edge-iot/web:offline-amd64
    container_name: frontend-iot
    profiles: ["ui"]            # 仅「完整模式」启动，平时跑采集不需要前端
    network_mode: host          # 直接绑宿主机 :80
    environment:
      # host 网络下 nginx 反代到本机 django
      - BACKEND_UPSTREAM=${BACKEND_UPSTREAM:-127.0.0.1:8000}
      # 宿主机 :80 被占用时，在 .env 里设 WEB_PORT=8080 即可（nginx 监听端口随之切换）
      - WEB_PORT=${WEB_PORT:-80}
    depends_on:
      - django
    restart: unless-stopped

volumes:
  app-db:                     # 共享 sqlite 配置库（django + celery 共用）
