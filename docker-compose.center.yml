# ============================================================================
# Center compose — control-plane only (django + redis + frontend).
#
# Mirrors the control-plane services from `docker-compose.yml` but does NOT
# bring up acquisition workers / InfluxDB / mosquitto on the center. In the
# distributed deployment those run per-edge instead (see
# docker-compose.edge.yml).
#
# Use:
#   docker compose -f docker-compose.center.yml up -d --build
# ============================================================================

services:
  redis:
    image: redis:7-alpine
    container_name: center-redis
    ports:
      - "6379:6379"
    networks:
      - center-network
    environment:
      - TZ=Asia/Shanghai
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  mosquitto:
    # Phase 2 P1 (XIU-100): center MQTT broker for the edge ↔ center uplink
    # migration off WebSocket. Anonymous on 1883 for local dev — TLS + ACL
    # are bolted on in later Phase-2 milestones.
    image: eclipse-mosquitto:2
    container_name: center-mosquitto
    ports:
      - "1883:1883"
    networks:
      - center-network
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    environment:
      - TZ=Asia/Shanghai
    restart: unless-stopped
    healthcheck:
      # The broker is "healthy" as soon as a subscriber can receive one
      # message on the always-published $SYS tree within 3 s.
      test: ["CMD-SHELL", "mosquitto_sub -h 127.0.0.1 -p 1883 -t '$$SYS/#' -C 1 -W 3 >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  django:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: center-django
    ports:
      - "8000:8000"
    networks:
      - center-network
    volumes:
      - ./backend:/app
    environment:
      - DJANGO_SETTINGS_MODULE=control_plane.settings
      - REDIS_HOST=center-redis
      - REDIS_PORT=6379
      # InfluxDB connection vars kept so legacy acquisition modules that
      # import settings don't crash on missing env. The center itself
      # does not write samples in the distributed topology.
      - INFLUXDB_HOST=center-redis
      - INFLUXDB_PORT=8086
      - INFLUXDB_TOKEN=unused-on-center
      - INFLUXDB_ORG=edge-iot
      - INFLUXDB_BUCKET=iot-data
      # Phase 2 P1 (XIU-100): center MQTT subscriber connects to this broker
      # at daphne startup. Disable with FLEET_MQTT_ENABLED=false to fall
      # back to WS-only ingest during the grey-rollout window.
      - FLEET_MQTT_ENABLED=true
      - FLEET_MQTT_HOST=center-mosquitto
      - FLEET_MQTT_PORT=1883
      - TZ=Asia/Shanghai
    depends_on:
      redis:
        condition: service_healthy
      mosquitto:
        condition: service_healthy
    restart: unless-stopped
    command: sh -c "python manage.py migrate && daphne -b 0.0.0.0 -p 8000 control_plane.asgi:application"

  frontend:
    image: node:18-alpine
    container_name: center-frontend
    ports:
      - "5173:5173"
    networks:
      - center-network
    volumes:
      - ./frontend:/app
      - ./frontend/node_modules:/app/node_modules:rw
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    environment:
      - TZ=Asia/Shanghai
    depends_on:
      - django
    restart: unless-stopped

networks:
  center-network:
    driver: bridge
